name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify generated website data
        run: python problem_bank.py index --check

      - name: Validate website JavaScript
        run: node --check dist/app.js

      - name: Prepare public website artifact
        run: |
          mkdir pages-site
          cp dist/index.html dist/styles.css dist/app.js dist/data.json pages-site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
